<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>굿잇츠 · 4화 촬영 화면</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.css"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;cursor:none}body{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#F8FAFC}#canvas{position:absolute;width:1920px;height:1080px;transform-origin:top left;background:#0F172A;padding:64px 70px}.header{display:flex;align-items:center;gap:28px;font-size:38px;margin-bottom:50px}.logo{color:#F8FAFC;background:#8B1E3F;padding:8px 22px;font-weight:850;font-size:50px;border-radius:8px}.date{margin-left:auto;color:#BBC7D7}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.region{position:relative;height:260px;padding:25px;border:3px solid #617086;border-radius:18px;background:#1E293B}.region h2{font-size:56px;margin:0 0 4px;font-weight:800}.numbers{display:flex;align-items:baseline;justify-content:space-between;font-size:46px;font-weight:750}.region p{font-size:36px;margin:8px 0 0;line-height:1.1;letter-spacing:-1px}.bad{background:#4A242F;border-color:#F2555A}.good{background:#113F38;border-color:#30A46C}.dot{position:absolute;top:25px;right:24px;width:16px;height:16px;border-radius:50%;background:#8B8D98}.bad .dot{background:#F2555A}.good .dot{background:#30A46C}.good .renew{color:#73E4AB;font-size:54px}.blink{animation:flash .5s ease-out}@keyframes flash{50%{filter:brightness(1.7)}}.event{background:#8B1E3F!important;padding:70px 90px!important}.event .logo{background:transparent;padding:0;font-size:60px}.event h1{font-size:120px;line-height:1.25;letter-spacing:-4px;margin:70px 0 40px;max-width:1740px}.event p{font-size:48px}.panel{background:#1E293B;padding:45px;border-radius:22px}.title{font-size:58px;margin:0 0 55px;line-height:1.35}.bar{height:82px;background:#304057;borde 위: 성남시 분당구","sourceNote":"경계: KOSTAT 2013 · 판교 권역의 행정구역 대용","ordersLabel":"일 주문","renewalLabel":"재구독률"}},"regions":[{"name":"여의도","orders":420,"renewal":40,"cause":"","code":"11190"},{"name":"강남","orders":310,"renewal":6,"cause":"쿠폰 소진 후 해지 213건","code":"11230"},{"name":"판교","orders":38,"renewal":9,"cause":"사내식당 밀집","code":"31023"},{"name":"하남·구리","orders":52,"renewal":11,"cause":"키친에서 40분"},{"name":"부산","orders":61,"renewal":8,"cause":"예측 정확도 48%"},{"name":"송도","orders":44,"renewal":10,"cause":"점심 기사 부족"},{"name":"일산","orders":41,"renewal":12,"cause":"주문 100건 미만"},{"name":"수원","orders":57,"renewal":10,"cause":"주문 100건 미만"},{"name":"광화문","orders":85,"renewal":14,"cause":"주문 100건 미만"},{"name":"대전","orders":49,"renewal":9,"cause":"주문 100건 미만"},{"name":"대구","orders":46,"renewal":8,"cause":"주문 100건 미만"},{"name":"광주","orders":39,"renewal":7,"cause":"주문 100건 미만"}],"pages":[{"id":"H4-03","states":1,"kind":"ads"}]};function renderScreen(page,state,animated,progress,previous){
 const B=DATA.brand,R=DATA.regions;
 const header=t=>`<div class="header"><span class="logo">${B.company}</span><span>${t}</span></div>`;
 const title=t=>`<h1 class="title">${t}</h1>`;
 const row=t=>`<div class="row">${t}</div>`;
 const bar=(value,color='#8B1E3F',height=82)=>`<div class="bar" style="height:${height}px"><div style="width:${value}%;background:${color}"></div></div>`;
 const reveal=(i)=>!animated?1:Math.max(0,Math.min(1,progress*2.5-i*.3));
 let html='',mode='',phone=false;
 switch(page.kind){
 case 'dashboard':{
 const active=s=>s===5?R.slice(1).map(r=>r.name):['판교','하남·구리','부산','송도'].slice(0,s);
 const bad=active(state),old=active(previous??state);
 html=header('AI 점심 구독 · 권역 현황').replace('</div>',`<span class="date">출시 D+${state===5?'14':'3'}</span></div>`)+`<div class="grid">`+R.map((r,i)=>{const status=bad.includes(r.name)?'bad':state===5&&i===0?'good':'';return `<section class="region ${status} ${bad.includes(r.name)&&!old.includes(r.name)?'blink':''}"><span class="dot"></span><h2>${r.name}</h2><div class="numbers"><span>${r.orders}건</span><span class="renew">${r.renewal}%</span></div>${status==='bad'?`<p>${r.cause}</p>`:status==='good'?'<p style="color:#73E4AB;font-weight:800;font-size:42px">재구독률 40%</p>':''}</section>`}).join('')+'</div>';break;}
 case 'event':mode='event';html=`<span class="logo">${B.company}</span><h1>AI 점심 구독,<br>오늘 전국 12개 권역 동시 출시</h1><p>${B.event.subtitle}</p>`;break;
 case 'resource':html=header('AI 점심 구독')+title('AI 점심 구독 — 개발 리소스 배분 (안)')+`<div style="display:flex;height:220px;margin-top:100px;overflow:hidden;border-radius:15px"><div style="width:${80*progress}%;background:#8B1E3F;padding:50px 30px;font-size:54px;white-space:nowrap">예측 모델 80%</div><div style="flex:1;background:#617086;padding:50px 25px;font-size:45px">배송 20%</div></div>`+row('배송 20% (기사 300명 충원)')+row('배차 시스템 — 기존 유지 · 배송 AI — 2단계');break;
 case 'reviews':{const reviews=state===0?[['★★☆☆☆','제육 귀신같이 맞추는데 12시 40분'],['★★☆☆☆','메뉴는 정확, 배송은 지각'],['★☆☆☆☆','맞추면 뭐 하나 늦는데']]:[['★★★☆☆','AI 추천은 똑같은데 결국 가지러 가야 함'],['★★★☆☆','편의점은 배달이 없네']];html=header(state===0?'AI 점심 구독 리뷰':'○○편의점 AI 추천 도시락 리뷰')+`<div class="reviews">`+reviews.map(([stars,text],i)=>`<div class="review" style="opacity:${reveal(i)}"><span class="stars">${stars}</span>${text}</div>`).join('')+'</div>';break;}
 case 'tuning':html=header('AI 점심 구독')+title('취향 예측 모델 · 실험 #47')+`<div class="big">${(94+1.1*(animated?progress:0)).toFixed(1)}<span style="font-size:90px">%</span></div><div class="panel">`+['v2.1　93.2%','v2.2　94.0%','v2.3　95.1%'].map(row).join('')+'</div>';break;
 case 'queue':if(state===1){html=header('AI 점심 구독')+['기존 배달 — 지금 주문 → 가까운 기사 1건','도시락 — 12시 정각 → 한 빌딩 수십 건','같은 시스템으로'].map((t,i)=>`<div class="review" style="margin:35px 0;opacity:${reveal(i)};font-size:${i===2?70:46}px">${t}</div>`).join('');}else{const values=[10,12,16,13,18,12,15,20,17,20,300,220,160,110,75,45,25,15,10];html=header('AI 점심 구독')+title('실시간 배차 대기열 · 예약 주문 · 최고 300건 (11:50)')+`<svg viewBox="0 0 1780 650" width="1780" height="650"><path d="M65 30V550H1740" stroke="#66758B" fill="none" stroke-width="3"/>${[0,100,200,300].map(v=>`<text x="0" y="${550-v*1.5}" font-size="36" fill="#B6C3D6">${v}</text>`).join('')}${values.map((v,i)=>{const p=animated?Math.max(0,Math.min(1,progress*values.length-i)):1;const time=660+i*5;return `<rect x="${80+i*86}" y="${550-v*1.5*p}" width="55" height="${v*1.5*p}" rx="5" fill="${i===10?'#F2555A':'#617086'}"/>${i%2===0?`<text x="${70+i*86}" y="600" font-size="36" fill="#B6C3D6">${Math.floor(time/60)}:${String(time%60).padStart(2,'0')}</text>`:''}`}).join('')}</svg>`;}break;
 case 'rider':phone=true;html=header('라이더 · 오늘 배차')+['나','다른 기사','다른 기사'].map(w=>`<div class="review"><b style="color:#FFC53D">○○타워</b><br>12:00 · 1건<br>배정: ${w}</div>`).join('')+row('같은 건물 주문 7건 · 기사 3명에게 따로 배정');break;
 case 'news':if(state===0){phone=true;html=`<div style="margin-top:140px;font-size:120px;text-align:center">12:00</div><div class="review" style="margin-top:160px;opacity:${animated?progress:1};translate:0 ${(1-progress)*-100}px">[속보] 편의점 체인 ○○, 'AI 추천 도시락' 출시</div>`;}else html=`<div class="header">○○경제</div>`+title("편의점 체인 ○○, 'AI 추천 도시락' 출시 — 전국 1만 점포에서 예약 픽업")+`<div class="sub">김○○</div><div class="panel" style="margin-top:40px;background:#526074;text-align:center;font-size:40px;padding:55px">편의점 AI 도시락 진열대</div>`+['○○편의점이 고객 구매 데이터를 바탕으로 도시락을 추천하는 서비스를 내놨다.','앱으로 예약하면 점심시간에 가까운 점포에서 찾아갈 수 있다.','배달은 하지 않는다.'].map(row).join('');break;
 case 'cost':mode='sheet';html=`<div class="sub" style="color:#475569">가격산정_v3</div>`+title('AI 점심 구독 가격 산정 (안)')+`<table><tr><th></th><th>A</th><th>B</th></tr>${[['AI 개발비 회수','2,500'],['키친 원가','9,000'],['배송','3,000'],['마진','3,500'],['판매가','18,000']].map(([a,b],i)=>`<tr class="${i===4?'total':''}"><td>${i+1}</td><td>${a}</td><td>${b}</td></tr>`).join('')}</table>`+row('포지셔닝 — 프리미엄');break;
 case 'renewal':{const last=[2,4,5][state];html=header('AI 점심 구독')+title('재구독률 (주차별)')+`<div style="position:absolute;right:100px;top:160px;font-size:100px;color:#FFC53D;font-weight:800">12%</div><svg viewBox="0 0 1750 670" class="linechart"><path d="M100 40V550H1670" stroke="#8290A7" stroke-width="3" fill="none"/>${[0,10,20,30,40,50].map(v=>`<text x="15" y="${558-v*10}" font-size="36" fill="#BBC7D7">${v}%</text>`).join('')}${[1,2,3,4,5,6].map(v=>`<text x="${100+(v-1)*300}" y="615" font-size="38" fill="#BBC7D7">${v}주</text>`).join('')}<path d="M400 430H${400+Math.max(0,last-2)*300*progress}" stroke="#FFC53D" stroke-width="10" fill="none"/><circle cx="400" cy="430" r="12" fill="#FFC53D"/>${state>=1?'<path d="M700 220V550" stroke="#B6C3D6" stroke-width="3" stroke-dasharray="10"/><text x="510" y="180" fill="#F8FAFC" font-size="40">1만 5천 원으로 인하</text>':''}${state===2?'<path d="M1300 330V550" stroke="#B6C3D6" stroke-width="3" stroke-dasharray="10"/><text x="1200" y="295" fill="#F8FAFC" font-size="40">첫 주 무료</text>':''}</svg>`;break;}
 case 'promo':phone=true;html=header('AI 점심 구독')+`<div style="background:#8B1E3F;border-radius:24px;padding:60px 45px;margin-top:80px"><h1 style="font-size:100px;margin:0 0 50px">${state===0?'AI 점심 구독<br>1만 5천 원':'첫 주 무료'}</h1><div style="font-size:60px">${state===0?'3천 원 내렸어요':'지금 구독하면 5일 무료'}</div></div>`;break;
 case 'ads':mode='ads';html=header('AI 점심 구독')+title('전국 광고 집행 현황 · 4주 차')+`<div class="big" style="font-size:110px">집행률 50% <span style="font-size:42px;color:#B6C3D6">(예산 대비)</span></div>`+bar(50)+`<div class="panel" style="margin-top:50px">`+[['TV',55],['디지털',48],['옥외',41]].map(([t,v])=>row(`${t} ${v}%`)+bar(v,'#617086',30)).join('')+'</div>';break;
 case 'voc':if(state===0){html=header('고객의 소리')+title('해지 설문 자유응답 (1,240건)')+['12시에 와야 의미가 있어요','점심시간 끝나고 왔어요','메뉴는 괜찮은데 늦어요','편의점보다 비싸요','12시 40분 도착, 해지합니다'].map(t=>`<div class="review" style="margin:15px 0;padding:23px 30px">${t}</div>`).join('');}else if(state===1){html=header('고객의 소리')+title('상담 녹음 (380건)')+['#0217 · 해지 문의 · 0:38 · 배송 지연','#0342 · 해지 문의 · 0:41 · 가격','#0388 · 배송 문의 · 1:02 · 배송 지연'].map(t=>`<div class="review" style="margin:30px 0">${t}</div>`).join('');}else{const index=state===2?'0217':'0342';html=header('고객의 소리')+title(`재생 #${index}`)+`<svg width="1780" height="300" viewBox="0 0 1780 300">${Array.from({length:70},(_,i)=>{const amp=animated?30+100*Math.abs(Math.sin(i*1.7+progress*30)):30+80*Math.abs(Math.sin(i*1.7));return `<rect x="${i*25}" y="${150-amp}" width="10" height="${amp*2}" rx="4" fill="#AABBD5"/>`}).join('')}</svg>`+bar(animated?progress*100:0,'#8B1E3F',18)+`<div class="review" style="font-size:54px;margin-top:70px">${state===2?'메뉴는 아무거나 괜찮아요. 12시에만 정확히 와 주면 돼요.':'편의점보다 비싼 건 괜찮은데, 만 이천 원 넘으면 좀…'}</div>`;}break;
 case 'frequency':html=header('고객의 소리')+title('해지 사유 자유응답 · 단어 빈도 (1,240건)')+[['12시',412],['늦음',287],['지각',166],['가격',151],['만 원',98],['메뉴',23],['AI 추천',11]].map(([t,v],i)=>`<div class="freq"><span>${t}</span>${bar(v/412*100*(animated?Math.max(0,Math.min(1,progress*2-i*.15)):1),i===0?'#FFC53D':'#617086',55)}<b>${v}</b></div>`).join('');break;
 }
 return {html,mode,phone};
};(function runtime(){
 const canvas=document.getElementById('canvas'),debug=document.getElementById('debug');let index=0,state=0,animation=null,animated=false,progress=1,previous=0;
 function fit(){const p=renderScreen(DATA.pages[index],state,animated,progress,previous);canvas.style.width=(p.phone?1080:1920)+'px';canvas.style.height=(p.phone?1920:1080)+'px';const scale=Math.min(innerWidth/(p.phone?1080:1920),innerHeight/(p.phone?1920:1080));canvas.style.transform=`scale(${scale})`;canvas.style.left=(innerWidth-(p.phone?1080:1920)*scale)/2+'px';canvas.style.top=(innerHeight-(p.phone?1920:1080)*scale)/2+'px';}
 function draw(){const p=renderScreen(DATA.pages[index],state,animated,progress,previous);canvas.className=p.mode+(p.phone?' phone':'');canvas.innerHTML=p.html;canvas.dataset.page=DATA.pages[index].id;canvas.dataset.state=String.fromCharCode(97+state);fit();}
 function reset(){if(animation)cancelAnimationFrame(animation);animation=null;animated=false;progress=1;previous=0;}
 function change(s){reset();previous=state;state=Math.max(0,Math.min(DATA.pages[index].states-1,s));draw();}
 function go(){reset();state=0;index=Math.max(0,DATA.pages.findIndex(p=>p.id===location.hash.slice(1)));draw();}
 function animate(){reset();animated=true;progress=0;const duration=DATA.pages[index].kind==='tuning'?1500:DATA.pages[index].kind==='voc'?(state===2?38000:41000):DATA.pages[index].kind==='queue'?2000:1500;const start=performance.now();function tick(now){progress=Math.min(1,(now-start)/duration);draw();if(progress<1)animation=requestAnimationFrame(tick);}animation=requestAnimationFrame(tick);}
 addEventListener('hashchange',go);addEventListener('resize',fit);addEventListener('keydown',e=>{if(e.repeat)return;const key=e.key.toLowerCase();if([' ','arrowright','arrowleft','pageup','pagedown','r','`'].includes(key)||/^[a-f]$/.test(key))e.preventDefault();if(key==='`'){debug.style.display=debug.style.display==='block'?'none':'block';return;}if(key==='pagedown'||key==='pageup'){const next=Math.max(0,Math.min(DATA.pages.length-1,index+(key==='pagedown'?1:-1)));if(next!==index)location.hash=DATA.pages[next].id;return;}if(key==='r'){change(0);return;}if(key==='arrowright'){change(state+1);return;}if(key==='arrowleft'){change(state-1);return;}if(/^[a-f]$/.test(key)){change(key.charCodeAt(0)-97);return;}if(key===' '){const kind=DATA.pages[index].kind;if(['dashboard','renewal','promo'].includes(kind))change(state+1);else if(['rider','event','cost','ads'].includes(kind))return;else animate();}});
 debug.innerHTML=DATA.pages.map(p=>`<a href="#${p.id}">${p.id}</a>`).join('')+'PageUp/Down: 페이지 · a–f: 상태 · Space: 실행 · R: 초기화';go();
})();</script></body></html>
